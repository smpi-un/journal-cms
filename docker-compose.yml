services:
  payload:
    image: node:18-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
      - ./data/payload/uploads:/uploads   # ← ホストの ./data/payload-uploads に保存される

    working_dir: /home/node/app/
    # command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm dev"
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm add sharp && pnpm dev"
    depends_on:
      - mongo
      # - postgres
      - meilisearch
      - garage
    env_file:
      - .env
    environment:
      - NPM_CONFIG_IGNORE_SCRIPTS=false
      - PAYLOAD_UPLOAD_DIR=/app/uploads
      - MEILISEARCH_HOST=http://meilisearch:7700
      # - DATABASE_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/payload-db?authSource=admin
      # - MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/payload-db?authSource=admin
      - MONGODB_URI=mongodb://mongo:27017/payload-db?authSource=admin
      - S3_ENDPOINT=http://garage:3900
      - S3_FORCE_PATH_STYLE=true
      # - S3_BUCKET=my-bucket
      - S3_REGION=garage
      - S3_ACCESS_KEY=${GARAGE_DEFAULT_ACCESS_KEY}
      - S3_SECRET_KEY=${GARAGE_DEFAULT_SECRET_KEY}
    extra_hosts: # for Dify
      - "host.docker.internal:host-gateway"
      
  mongo:
    image: mongo:latest
    ports:
      - '27017'
    command:
      - --storageEngine=wiredTiger
    #   - "--replSet"
    #   - "rs0"
    #   - "--bind_ip_all"
    #   - "--port"
    #   - "27017"
    env_file:
      - .env
    volumes:
      - data:/data/db

  # mongo-express:
  #   image: mongo-express:latest
  #   container_name: mongo-express
  #   restart: always
  #   ports:
  #     - "8081:8081"
  #   environment:
  #     # ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
  #     # ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
  #     ME_CONFIG_MONGODB_SERVER: mongo
  #   env_file:
  #     - .env
  #   depends_on:
  #     - mongo

  # # MongoDBレプリカセット自動初期化用
  # mongo-init-replica:
  #   image: mongo:latest
  #   depends_on:
  #     - mongo
  #   env_file:
  #     - .env
  #   restart: "no"
  #   entrypoint: >
  #     /bin/bash -c "
  #     echo 'Waiting for Mongo to start...';
  #     sleep 5;
  #     # レプリカセットの初期化を実行（失敗してもエラーで止まらないように || true をつける）
  #     mongosh --host mongo:27017 -u $${MONGO_INITDB_ROOT_USERNAME} -p $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval 'rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}]})' || true;
  #     echo 'Replica set initialized.';
  #     "

  redis:
    image: redis:7-alpine
    container_name: my_redis
    restart: unless-stopped
  appsmith:
     image: index.docker.io/appsmith/appsmith-ee
     container_name: appsmith
     ports:
         - "80:80"
         - "443:443"
     volumes:
         - appsmith-data:/appsmith-stacks
     restart: unless-stopped
  # appsmith:
  #   image: appsmith/appsmith-ce:v1.9.43
  #   container_name: my_appsmith
  #   restart: unless-stopped
  #   ports:
  #     - "8080:80"
  #   env_file: ./.env
  #   # URIからreplicaSetパラメータを削除3
  #   environment:
  #     # APPSMITH_MONGODB_URI: mongodb://mongo:27017/appsmith?authSource=admin
  #     # APPSMITH_MONGODB_URI: mongodb://mongo:27017/appsmith?authSource=admin&replicaSet=rs0
  #     # APPSMITH_MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/appsmith?authSource=admin
  #     # APPSMITH_MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/appsmith?authSource=admin&replicaSet=rs0
  #     APPSMITH_REDIS_URL: redis://redis:6379
  #   depends_on:
  #     - mongo
  #     - redis
  #   volumes:
  #     - appsmith-data:/appsmith-stacks


  # Uncomment the following to use postgres
  # postgres:
  #   restart: always
  #   image: postgres:latest
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: my_meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    env_file:
      - .env
    volumes:
      - meili-data:/meili_data

  # オブジェクトストレージ (画像のS3互換保存先)
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: my_garage
    restart: unless-stopped
    command: /garage server --single-node --default-bucket
    ports:
      - "3900:3900" # S3 API
      - "3902:3902" # S3 Web
      - "3903:3903" # Admin API
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
      - GARAGE_DEFAULT_ACCESS_KEY=${GARAGE_DEFAULT_ACCESS_KEY}
      - GARAGE_DEFAULT_SECRET_KEY=${GARAGE_DEFAULT_SECRET_KEY}
      - GARAGE_DEFAULT_BUCKET=${GARAGE_DEFAULT_BUCKET}

volumes:
  data:
  appsmith-data:
  # pgdata:
  node_modules:
  meili-data:
  garage-meta:
  garage-data:
